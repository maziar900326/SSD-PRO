name: SSD-PRO Tests

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests